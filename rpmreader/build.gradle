plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lynk.rpmreader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lynk.rpmreader'
        minSdk 28
        targetSdk 34
        versionCode 21
        versionName '2.0.1-hud-shizuku'
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    def shizukuVersion = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizukuVersion"
    implementation "dev.rikka.shizuku:provider:$shizukuVersion"
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation platform('io.netty:netty-bom:4.1.136.Final')
    implementation 'io.grpc:grpc-netty:1.80.0'
    implementation 'io.grpc:grpc-stub:1.80.0'
}

def rpmLogicTestClasses = layout.buildDirectory.dir('rpm-logic-test/classes')

tasks.register('compileRpmLogicTest', JavaCompile) {
    source = files(
            'src/main/java/com/lynk/rpmreader/ProtoReader.java',
            'src/main/java/com/lynk/rpmreader/ApvpSignalCodec.java',
            'src/main/java/com/lynk/rpmreader/RpmGaugeModel.java',
            'src/main/java/com/lynk/rpmreader/RpmDisplayLocation.java',
            'src/main/java/com/lynk/rpmreader/RpmDisplayText.java',
            'src/main/java/com/lynk/rpmreader/HudDisplayParser.java',
            'src/main/java/com/lynk/rpmreader/StartupMotion.java',
            'src/main/java/com/lynk/rpmreader/CarRpmValue.java',
            'src/test/java/com/lynk/rpmreader/RpmProtoDecoderTest.java')
    classpath = files()
    destinationDirectory = rpmLogicTestClasses
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.register('rpmLogicTest', JavaExec) {
    group = 'verification'
    description = 'Runs zero-dependency tests for the RPM protobuf logic.'
    dependsOn 'compileRpmLogicTest'
    classpath = files(rpmLogicTestClasses)
    mainClass = 'com.lynk.rpmreader.RpmProtoDecoderTest'
}

name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test and build
        run: ./gradlew :rpmreader:rpmLogicTest :rpmreader:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LynkRPMReader-debug
          path: rpmreader/build/outputs/apk/debug/rpmreader-debug.apk
          if-no-files-found: error

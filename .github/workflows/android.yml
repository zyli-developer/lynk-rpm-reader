name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  public-repo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public repository gate tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_public_repo_gate.py'
      - name: Public repository gate
        run: python3 scripts/public_repo_gate.py

  build:
    needs: public-repo-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test and build
        run: ./gradlew :rpmreader:rpmLogicTest :rpmreader:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LynkRPMReader-debug
          path: rpmreader/build/outputs/apk/debug/rpmreader-debug.apk
          if-no-files-found: error
